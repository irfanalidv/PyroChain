[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrochain"
version = "0.2.0"
description = "PyTorch + LangChain for agentic feature engineering: multimodal (text + image) feature extraction with LoRA adapters, validation agents, and conversation memory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
maintainers = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
keywords = [
    "pytorch",
    "langchain",
    "feature-engineering",
    "feature-extraction",
    "machine-learning",
    "multimodal",
    "agents",
    "agentic-ai",
    "llm",
    "lora",
    "adapters",
    "transformers",
    "embeddings",
    "ecommerce",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.56.0",
    "langchain-core>=0.3.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "opencv-python-headless>=4.8.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.60.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pandas>=1.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.7.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.15",
    "sphinx-autodoc-typehints>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/irfanalidv/PyroChain"
Documentation = "https://github.com/irfanalidv/PyroChain#readme"
Repository = "https://github.com/irfanalidv/PyroChain"
Issues = "https://github.com/irfanalidv/PyroChain/issues"
Changelog = "https://github.com/irfanalidv/PyroChain/blob/main/CHANGELOG.md"

[project.scripts]
pyrochain = "pyrochain.cli:main"

[tool.setuptools.packages.find]
include = ["pyrochain*"]

[tool.setuptools.package-data]
pyrochain = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "RET", "PIE"]
ignore = [
    "RUF022",  # __all__ is grouped by topic on purpose, not sorted
    "RET504",  # "x = compute(); return x" is kept where it documents what is returned
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]  # examples adjust sys.path / settings before importing

[tool.ruff.lint.isort]
known-first-party = ["pyrochain"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["pyrochain"]
